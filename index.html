<title>🌐 Online Tic-Tac-Toe</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
            url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920') center/cover fixed no-repeat;
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 15px; color: white;
    }
    .container {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        border-radius: 25px; padding: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.2);
        max-width: 500px; width: 100%;
    }
    h1 { text-align: center; font-size: 1.6em; margin-bottom: 15px; }
    
    /* Ad Space */
    .ad-space {
        width: 100%; height: 60px; background: rgba(0,0,0,0.5);
        border: 1px dashed #aaa; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.8em; color: #ccc; margin-bottom: 15px;
    }

    .setup-box { margin-bottom: 15px; text-align: center; }
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input {
        flex: 1; padding: 10px; border-radius: 10px; border: none;
        background: rgba(255,255,255,0.9); font-size: 1em; text-align: center;
    }
    .btn {
        padding: 10px 15px; border: none; border-radius: 10px;
        background: #2ecc71; color: white; font-weight: bold;
        cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: #27ae60; }
    .btn-blue { background: #3498db; }
    .btn-blue:hover { background: #2980b9; }
    
    .status-box {
        text-align: center; font-size: 1.1em; font-weight: bold;
        margin-bottom: 15px; min-height: 25px; color: #f1c40f;
    }

    .board {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 10px; margin-bottom: 15px; aspect-ratio: 1;
    }
    .cell {
        background: rgba(255,255,255,0.9); border-radius: 15px;
        font-size: 2.8em; font-weight: bold; color: #333;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: 0.2s; user-select: none;
    }
    .cell:hover:not(.taken) { transform: scale(1.05); }
    .cell.x { color: #e74c3c; }
    .cell.o { color: #3498db; }
    .cell.taken { cursor: not-allowed; }
    .cell.win { background: #2ecc71; color: white; animation: pulse 0.6s infinite alternate; }
    
    @keyframes pulse { from{transform:scale(1)} to{transform:scale(1.08)} }

    .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
    <h1>🌐 Tic-Tac-Toe</h1>

    <!-- Ad Space: Yahan AdSense ka code baad mein daalna -->
    <div class="ad-space">Advertisement Space (Google AdSense)</div>

    <!-- Setup Screen -->
    <div id="setupScreen">
        <div class="setup-box">
            <p style="margin-bottom:10px; font-size:0.9em;">Create a new room or join a friend!</p>
            <div class="input-group">
                <input type="text" id="roomInput" placeholder="Enter Room Code (e.g. 1234)">
                <button class="btn btn-blue" onclick="joinRoom()">Join</button>
            </div>
            <button class="btn" onclick="createRoom()" style="width:100%">Create New Room</button>
        </div>
        <hr style="border-color:rgba(255,255,255,0.2); margin:15px 0;">
        <button class="btn btn-blue" onclick="startLocalGame()" style="width:100%">Play on Same Device (Local)</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden">
        <div class="status-box" id="status">Waiting...</div>
        <div class="board" id="board"></div>
        <button class="btn" onclick="location.reload()" style="width:100%; background:#e74c3c;">Back to Menu</button>
    </div>
</div>

<!-- Firebase SDK (Google ka database) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ⚠️ YAHAN APNA FIREBASE CONFIG DAALEIN ⚠️
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Game Logic
  window.board = ["","","","","","","","",""];
  window.currentPlayer = "X";
  window.gameOver = false;
  window.mySymbol = ""; // X ya O
  window.roomCode = "";
  window.isOnline = false;
  
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");

  window.initBoard = function() {
    boardEl.innerHTML = "";
    window.board.forEach((_, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.onclick = () => handleClick(i);
        boardEl.appendChild(cell);
    });
  }

  window.startLocalGame = function() {
    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    window.isOnline = false;
    window.mySymbol = "X";
    window.statusEl.textContent = "Player X's turn";
    initBoard();
  }

  window.createRoom = function() {
    const code = Math.floor(1000 + Math.random() * 9000).toString(); // 4 digit code
    window.roomCode = code;
    window.isOnline = true;
    window.mySymbol = "X"; // Creator is X
    
    // Database mein room banao
    set(ref(db, 'rooms/' + code), {
        board: ["","","","","","","","",""],
        turn: "X",
        gameOver: false
    });

    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    statusEl.innerHTML = `Room Code: <b>${code}</b><br>Share this code. You are X.`;
    initBoard();
    listenToRoom(code);
  }

  window.joinRoom = function() {
    const code = document.getElementById("roomInput").value;
    if(code.length < 4) return alert("Enter valid 4-digit code");
    
    window.roomCode = code;
    window.isOnline = true;
    window.mySymbol = "O"; // Joiner is O
    
    document.getElementById("setupScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    statusEl.textContent = "Joining room...";
    initBoard();
    listenToRoom(code);
  }

  function listenToRoom(code) {
    const roomRef = ref(db, 'rooms/' + code);
    onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if(!data) return;
        
        // Update board
        window.board = data.board;
        window.currentPlayer = data.turn;
        window.gameOver = data.gameOver;

        // Update UI
        boardEl.innerHTML = "";
        window.board.forEach((val, i) => {
            const cell = document.createElement("div");
            cell.className = "cell";
            if(val) {
                cell.textContent = val;
                cell.classList.add(val.toLowerCase(), "taken");
            } else {
                cell.onclick = () => handleClick(i);
            }
            boardEl.appendChild(cell);
        });

        // Check win
        const result = checkWinner();
        if(result) {
            if(result.winner !== "Tie") {
                result.line.forEach(i => boardEl.children[i].classList.add("win"));
                statusEl.textContent = `🎉 Player ${result.winner} Wins!`;
            } else {
                statusEl.textContent = "🤝 It's a Tie!";
            }
            return;
        }

        // Update Status
        if(!window.gameOver) {
            if(window.currentPlayer === window.mySymbol) {
                statusEl.innerHTML = `Your Turn (${window.mySymbol})`;
            } else {
                statusEl.innerHTML = `Waiting for opponent (${window.currentPlayer})...`;
            }
        }
    });
  }

  window.handleClick = function(i) {
    if(window.gameOver || window.board[i] !== "") return;

    if(window.isOnline) {
        if(window.currentPlayer !== window.mySymbol) {
            alert("Wait for your turn!");
            return;
        }
        // Send move to database
        const newBoard = [...window.board];
        newBoard[i] = window.mySymbol;
        
        const nextTurn = window.mySymbol === "X" ? "O" : "X";
        const win = checkWinnerOnBoard(newBoard);
        
        update(ref(db, 'rooms/' + window.roomCode), {
            board: newBoard,
            turn: nextTurn,
            gameOver: win ? true : false
        });
    } else {
        // Local game logic
        window.board[i] = window.currentPlayer;
        const cell = boardEl.children[i];
        cell.textContent = window.currentPlayer;
        cell.classList.add(window.currentPlayer.toLowerCase(), "taken");
        
        const result = checkWinner();
        if(result) {
            window.gameOver = true;
            if(result.winner !== "Tie") {
                result.line.forEach(idx => boardEl.children[idx].classList.add("win"));
                statusEl.textContent = `🎉 Player ${result.winner} Wins!`;
            } else {
                statusEl.textContent = "🤝 It's a Tie!";
            }
        } else {
            window.currentPlayer = window.currentPlayer === "X" ? "O" : "X";
            statusEl.textContent = `Player ${window.currentPlayer}'s turn`;
        }
    }
  }

  function checkWinner() { return checkWinnerOnBoard(window.board); }
  
  function checkWinnerOnBoard(b) {
    for (const w of wins) {
        if (b[w[0]] && b[w[0]] === b[w[1]] && b[w[1]] === b[w[2]]) return { winner: b[w[0]], line: w };
    }
    return b.includes("") ? null : { winner: "Tie", line: null };
  }

  // Init board on load
  initBoard();
</script>
</body>
